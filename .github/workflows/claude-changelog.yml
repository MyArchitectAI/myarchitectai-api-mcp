name: Claude Changelog

# On a PR, ensure CHANGELOG.md has an [Unreleased] entry for user-facing changes.
# Claude edits CHANGELOG.md and commits it back to the PR branch. Its commits use
# the action's app token, which does not re-trigger workflows (no loop).
# Skips fork PRs (no secret access / can't push to the fork).

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Inspect this PR's diff. If it makes a user-facing change (behaviour, tools,
            options, or the public API — not internal refactors, tests, CI, or docs),
            make sure CHANGELOG.md has a matching entry under the [Unreleased] section in
            Keep a Changelog style (Added / Changed / Fixed / Removed), as one concise
            bullet. If an accurate entry already exists, or the change is not user-facing,
            make NO changes. Do not touch released sections or any file other than
            CHANGELOG.md. Commit only CHANGELOG.md.
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
