name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Three readable checks: `lint`, `build`, `test`. `build` and `test` each
# exercise Node 18/20/22 within a single job, so each stays one status check.
# Dependencies are pure JS (no native addons), so a single `npm ci` is reused
# across versions — only the runtime is switched between runs.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
      - run: npm ci
      - name: build + typecheck (Node 18.x)
        run: npm run build && npm run typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: build + typecheck (Node 20.x)
        run: npm run build && npm run typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: build + typecheck (Node 22.x)
        run: npm run build && npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
      - run: npm ci
      - name: test (Node 18.x)
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: test (Node 20.x)
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: test (Node 22.x)
        run: npm test
