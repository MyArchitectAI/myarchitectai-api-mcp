name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep the required `lint`, `build` and `test` check names stable.
# Use the development runtime from .nvmrc, with Node 26 LTS compatibility coverage.
# Dependencies are pure JS, so build/test reuse the install across runtimes.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: build + typecheck
        run: npm run build && npm run typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - name: build + typecheck (Node 26 LTS)
        run: npm run build && npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: test
        run: npm test
      - name: deploy-contract (live verifier fixtures)
        run: node --test scripts/verify-deployment.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - name: test (Node 26 LTS)
        run: npm test

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run api:check:live
