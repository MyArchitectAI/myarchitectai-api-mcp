name: Claude Review

# Keep the review plugin, prompt and tool settings aligned with API Portal.
# Same-repository, non-draft PRs only: fork PRs cannot access the OAuth secret.
# Dependabot runs use the same-named Dependabot secret, not the Actions secret.
# claude-code-action workflow changes take effect after merging to main.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require Claude OAuth secret
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            exit 0
          fi
          if [ "$GITHUB_ACTOR" = 'dependabot[bot]' ]; then
            echo '::error::Missing Dependabot secret CLAUDE_CODE_OAUTH_TOKEN. Add it under Settings > Secrets and variables > Dependabot; Actions secrets are unavailable to Dependabot-triggered runs.'
          else
            echo '::error::Missing Actions secret CLAUDE_CODE_OAUTH_TOKEN. Add it under Settings > Secrets and variables > Actions.'
          fi
          exit 1
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          allowed_bots: 'dependabot[bot]'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '--comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          show_full_output: true
          claude_args: '--model claude-opus-5-5 --allowedTools "Skill(*)" "Bash(*)" "WebSearch(*)" "WebFetch(*)"'
