name: Claude Review

# Automated PR review via the Claude Code GitHub Action. Posts INLINE comments
# on the specific offending lines via the action's buffered inline-comment tool,
# only when it finds real, worth-fixing issues.
#
# Incremental by design: the FIRST review (opened) looks at the whole PR; a
# re-review (synchronize) looks ONLY at the commits pushed since the last review
# (git diff <before>..<after>). That stops it from re-scanning unchanged code and
# surfacing a fresh batch of nitpicks on every push — it reports new problems
# only for what actually changed.
#
# Read-only: the allowlist grants the inline-comment tool plus read-only
# `gh pr diff/view`, `git diff/log`, and Read/Grep/Glob — NOT `gh pr comment` —
# so it physically cannot post a top-level summary. (We avoid `track_progress`
# because it force-adds Write/Edit/git tools that can't be pared back.)
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`, Claude
# Pro/Max). Skips fork PRs, which can't access secrets.
#
# Note: the action validates that this workflow matches the copy on the default
# branch, so changes here take effect only once merged to main — they cannot be
# tested on their own PR (you'll get "Workflow validation failed").

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            PREVIOUS_HEAD: ${{ github.event.before }}
            CURRENT_HEAD: ${{ github.event.after }}

            Decide what to review based on EVENT:
            - If EVENT is "synchronize" (a re-review after new commits): review
              ONLY what changed in this push — run
              `git diff ${{ github.event.before }} ${{ github.event.after }}`.
              The earlier commits were already reviewed on a previous run, so do
              NOT re-read or comment on code that did not change in this push.
              Report new problems only if they were introduced by these changes.
            - Otherwise (the first review): review the whole PR — run
              `gh pr diff`.
            Read the surrounding files for context as needed.

            Review for genuine, worth-fixing problems only: correctness bugs,
            broken error handling, security or API-key mishandling, a real missing
            edge case that would actually bite a user, or new behaviour shipped
            with no test at all. Apply a HIGH bar. Do NOT flag minor or purely
            theoretical edge cases, style, nits, or preferences, and never invent
            an issue just to have something to report — looking thorough is not
            the goal. If the change is sound, post nothing; a clean push should
            get zero comments.

            For each real issue, post an INLINE comment on the exact offending
            line using mcp__github_inline_comment__create_inline_comment with
            `confirmed: true`. Keep each to one or two sentences. Do NOT post a
            top-level summary comment and do not praise. Only post GitHub inline
            comments — never output the review as a chat message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
            --max-turns 20
            --model claude-sonnet-4-6
