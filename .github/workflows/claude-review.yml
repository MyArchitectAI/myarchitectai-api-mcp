name: Claude Review

# Automated PR review via the Claude Code GitHub Action.
# `track_progress: true` posts the result as a SINGLE comment that is updated in
# place on re-runs (no duplicate comments), and only when there's something to
# say. Requires a CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`, Claude
# Pro/Max). Skips fork PRs, which can't access secrets.
#
# Note: the action validates that this workflow matches the copy on the default
# branch, so changes here only take effect once merged to main.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review only the diff of this pull request. Be terse and high-signal.

            Comment ONLY on concrete problems: correctness bugs, missing edge
            cases, broken error handling, security or API-key mishandling, or new
            behaviour shipped without a test. Write each as a single line —
            `path:line — the problem`. Do not praise, do not summarise what the PR
            does, and do not raise style or nit-level points.

            If you find no such problems, do not write any findings.
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
