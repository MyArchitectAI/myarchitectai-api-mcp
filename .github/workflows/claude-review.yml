name: Claude Review

# Automated PR review via the Claude Code GitHub Action. Posts INLINE comments on
# the specific lines where it finds issues (via the action's inline-comment
# tool), and only when there are issues — no top-level summary comment (so no
# `track_progress`, which would consolidate everything into one comment).
# Requires a CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`, Claude
# Pro/Max). Skips fork PRs, which can't access secrets.
#
# Note: the action validates that this workflow matches the copy on the default
# branch, so changes here only take effect once merged to main.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the diff of this pull request. For EACH concrete problem you
            find — a correctness bug, missing edge case, broken error handling,
            security or API-key mishandling, or new behaviour shipped without a
            test — leave an INLINE review comment on the exact offending line using
            the inline-comment tool (mcp__github_inline_comment__create_inline_comment).
            Keep each comment to one or two sentences.

            Do NOT post a top-level summary comment, do not praise, and do not raise
            style or nit-level points. If you find no such problems, leave no
            comments at all.
          claude_args: |
            --max-turns 15
            --model claude-sonnet-4-6
