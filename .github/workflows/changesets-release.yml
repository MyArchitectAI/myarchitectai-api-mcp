name: Release (Changesets)

# On every push to main, Changesets maintains a "Version Packages" PR that
# accumulates the pending version bump + CHANGELOG entries from the
# .changeset/*.md files. Merging that PR is what writes CHANGELOG.md and bumps
# the version — so the changelog is tied to a shipped version, never to an
# in-flight feature PR.
#
# Publishing stays in release.yml (npm OIDC trusted publishing, triggered by a
# vX.Y.Z tag). GitHub deliberately blocks tags pushed by GITHUB_TOKEN from
# triggering other workflows, so after merging the Version PR you ship with one
# command from an up-to-date main:
#
#     git pull && npm run release:tag
#
# (Want zero-touch publishing? Add a RELEASE_PAT secret and we can auto-push the
# tag here instead.)

on:
  push:
    branches: [main]

concurrency: changesets-${{ github.ref }}

permissions:
  contents: write # push the changeset-release/main branch
  pull-requests: write # open/update the Version Packages PR

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No changesets pending → either nothing to release, or a Version PR just
      # merged. If the current version isn't tagged yet, nudge to ship it.
      - name: Release readiness notice
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Latest version $VERSION is already tagged — nothing to ship."
          else
            echo "::notice title=Ready to release::$VERSION is on main but untagged. Run 'npm run release:tag' to publish it via release.yml."
          fi
